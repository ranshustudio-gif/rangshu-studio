<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>壤序空間制作所 — RAN SHU INTERIOR DESIGN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public-site.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:"Noto Sans TC","Noto Sans JP","Yu Gothic",sans-serif;background:#fff;color:#222;font-weight:300}
    a{color:inherit;text-decoration:none}
    .home{position:relative;width:100%;height:100dvh;min-height:0;overflow:hidden;background:#171914;color:#fff}
    .home::before{content:"";position:absolute;inset:-7%;z-index:0;background:url("hero-garden.jpg") center 46% / cover no-repeat;transform:scale(1.18)}
    .home::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.22)}
    .home .rs-site-header{justify-content:flex-end}
    .home .rs-site-header .rs-brand{display:none}
    .home-brand{position:absolute;z-index:2;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);width:min(92%,760px);color:#fff;text-align:center;font-family:var(--rs-serif)}
    .home-brand-jp{font-size:27px;font-weight:400;letter-spacing:.12em;line-height:1.5}
    .home-brand-en{display:block;margin-top:13px;font-size:13px;font-weight:400;letter-spacing:.16em;line-height:1.5}
    .hero-work{display:none}
    .hero-work-link{position:relative;display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%;min-width:0;min-height:0}
    .hero-work-image{display:block;max-width:min(980px,78vw);max-height:calc(100dvh - var(--rs-header-h) - 118px);width:auto;height:auto;object-fit:contain}
    .hero-caption{position:absolute;left:0;bottom:-40px;max-width:100%;font-family:var(--rs-serif);font-size:12px;font-weight:400;letter-spacing:.1em;line-height:1.6;white-space:nowrap}
    .hero-caption-year{margin-left:12px;font-size:10px;letter-spacing:.1em;color:#777}
    .hero-message{font:11px/1.6 var(--rs-serif);letter-spacing:.1em;color:#777}
    .rs-site-header{box-sizing:border-box;max-width:100%}
    @media(max-width:600px){
      .home::before{inset:-8%;background-position:center center;transform:scale(1.14)}
      .home-brand-jp{font-size:22px}
      .home-brand-en{font-size:11px}
    }
  </style>
</head>
<body class="rs-public">
  <main class="home">
    <header class="rs-site-header">
      <a class="rs-brand" href="index.html" aria-label="壤序空間制作所首頁">
        <span class="rs-brand-jp">壤序空間制作所</span>
        <span class="rs-brand-en">RAN SHU INTERIOR DESIGN</span>
      </a>
      <nav class="rs-desktop-nav" aria-label="網站導覽">
        <a href="works.html">WORKS</a>
        <a href="service.html">SERVICE</a>
        <a href="index.html#about">ABOUT</a>
        <a href="journal.html">JOURNAL</a>
        <a href="index.html#contact">CONTACT</a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
      <button id="menuOpen" class="rs-menu-button" type="button" aria-label="menu" aria-expanded="false">MENU</button>
    </header>

    <div class="home-brand" aria-label="壤序空間制作所">
      <span class="home-brand-jp">壤序空間制作所</span>
      <span class="home-brand-en">RAN SHU INTERIOR DESIGN</span>
    </div>

    <nav id="drawer" class="rs-drawer" aria-label="行動版導覽">
      <button id="menuClose" class="rs-drawer-close" type="button" aria-label="close">CLOSE</button>
      <div class="rs-drawer-inner"><div><ul class="rs-drawer-list">
        <li><a href="works.html"><span class="rs-drawer-jp">作品</span><span class="rs-drawer-en">WORKS</span></a></li>
        <li><a href="service.html"><span class="rs-drawer-jp">服務內容</span><span class="rs-drawer-en">SERVICE</span></a></li>
        <li><a href="index.html#about"><span class="rs-drawer-jp">關於</span><span class="rs-drawer-en">ABOUT</span></a></li>
        <li><a href="journal.html"><span class="rs-drawer-jp">建築・空間紀錄</span><span class="rs-drawer-en">JOURNAL</span></a></li>
        <li><a href="index.html#contact"><span class="rs-drawer-jp">聯絡</span><span class="rs-drawer-en">CONTACT</span></a></li>
      </ul><a class="rs-drawer-social" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></div></div>
    </nav>

    <section class="hero-work" aria-label="最新作品">
      <div id="heroMessage" class="hero-message">Loading...</div>
      <a id="heroWorkLink" class="hero-work-link" href="#" hidden>
        <img id="heroWorkImage" class="hero-work-image" alt="">
        <span id="heroCaption" class="hero-caption"></span>
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const drawer=document.getElementById('drawer');
    const menuOpen=document.getElementById('menuOpen');
    const menuClose=document.getElementById('menuClose');
    menuOpen.addEventListener('click',()=>{drawer.classList.add('open');menuOpen.setAttribute('aria-expanded','true');});
    menuClose.addEventListener('click',()=>{drawer.classList.remove('open');menuOpen.setAttribute('aria-expanded','false');});
    drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{drawer.classList.remove('open');menuOpen.setAttribute('aria-expanded','false');}));

    async function loadHeroWork(){
      const message=document.getElementById('heroMessage');
      const link=document.getElementById('heroWorkLink');
      const image=document.getElementById('heroWorkImage');
      const caption=document.getElementById('heroCaption');
      try{
        if(!window.supabase||!window.RANGSHU_SUPABASE_URL||!window.RANGSHU_SUPABASE_KEY)throw new Error('Supabase configuration is unavailable.');
        const client=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY);
        let {data,error}=await client.schema('public').from('works').select('id,title,year,month,cover_url,created_at').eq('status','published').order('year',{ascending:false,nullsFirst:false}).order('month',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
        if(error&&error.code==='42703'&&/month/i.test(error.message||'')){
          const fallback=await client.schema('public').from('works').select('id,title,year,cover_url,created_at').eq('status','published').order('year',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
          data=fallback.data;error=fallback.error;
        }
        if(error)throw error;
        const work=(data||[]).find(item=>typeof item.cover_url==='string'&&item.cover_url.trim());
        if(!work){message.textContent='作品準備中';return;}
        image.src=optimizedImageUrl(work.cover_url);
        image.onerror=()=>{image.onerror=null;image.src=work.cover_url;};
        image.alt=work.title||'作品';
        image.decoding='async';
        link.href=`work-post.html?id=${encodeURIComponent(work.id)}`;
        caption.textContent=work.title||'';
        if(work.year){const year=document.createElement('span');year.className='hero-caption-year';year.textContent=work.year;caption.appendChild(year);}
        message.hidden=true;
        link.hidden=false;
      }catch(error){console.error('Homepage hero work load error:',error);message.textContent='作品讀取失敗';}
    }
    function optimizedImageUrl(value){
      if(typeof value!=='string'||!value)return value;
      const marker='/storage/v1/object/public/site-assets/';
      if(!value.includes(marker)||/\.dng$/i.test(value))return value;
      const extension=/\.png$/i.test(value)?'.jpg':'';
      return value.replace(marker,marker+'web-optimized/').replace(/\.[^.?#]+(?=\?|$)/,match=>extension||match);
    }
    loadHeroWork();
  </script>
</body>
</html>
