<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="public-site.css">
  <style>
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font:15px/2.15 sans-serif}
    .rs-site-header{box-sizing:border-box;max-width:100%;padding-left:32px;padding-right:32px}
    .rs-desktop-nav{min-width:0;gap:clamp(12px,1.2vw,24px)}
    .article{width:min(680px,calc(100% - 80px));max-width:100%;height:auto;min-height:0;overflow:visible;margin:0 auto;padding:180px 0}
    .hidden{display:none}
    .journal-block-text,.journal-image-text{white-space:pre-wrap;margin:0 0 28px}
    .journal-date{margin:6px 0 22px;font-size:11px;font-weight:400;letter-spacing:.08em;color:#777;text-align:right}
    .journal-image{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;margin:32px 0 12px;margin-left:0;margin-right:0}
    @media(max-width:700px){.rs-site-header{padding-left:20px;padding-right:20px}.article{width:calc(100% - 40px);margin:0 20px;padding-top:132px}}
  </style>
</head>
<body class="rs-public">
  <header class="rs-site-header">
    <a class="rs-brand" href="index.html"><span class="rs-brand-jp">壤序空間制作所</span><span class="rs-brand-en">RAN SHU INTERIOR DESIGN</span></a>
    <nav class="rs-desktop-nav"><a href="works.html">WORKS</a><a href="service.html">SERVICE</a><a href="index.html#about">ABOUT</a><a href="journal.html">JOURNAL</a><a href="index.html#contact">CONTACT</a><a href="https://www.instagram.com/" target="_blank">Instagram</a></nav>
    <button id="menuOpen" class="rs-menu-button">MENU</button>
  </header>
  <nav id="drawer" class="rs-drawer">
    <button id="menuClose" class="rs-drawer-close">CLOSE</button>
    <div class="rs-drawer-inner"><ul class="rs-drawer-list"><li><a href="works.html">WORKS</a></li><li><a href="service.html">SERVICE</a></li><li><a href="index.html#about">ABOUT</a></li><li><a href="journal.html">JOURNAL</a></li><li><a href="index.html#contact">CONTACT</a></li><li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li></ul></div>
  </nav>
  <article class="article">
    <div id="loading">Loading...</div>
    <div id="article" class="hidden"><h1 id="title"></h1><div id="date" class="journal-date"></div><div id="content"></div></div>
  </article>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const c=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY);
    const id=new URLSearchParams(location.search).get('id');
    const loadingNode=document.getElementById('loading');
    const articleNode=document.getElementById('article');
    const titleNode=document.getElementById('title');
    const contentNode=document.getElementById('content');
    const e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
    const optimizedImageUrl=value=>{if(typeof value!=='string'||!value)return value;const marker='/storage/v1/object/public/site-assets/';if(!value.includes(marker)||/\.dng$/i.test(value))return value;return value.replace(marker,marker+'web-optimized/').replace(/\.[^.?#]+(?=\?|$)/,'.jpg');};
    const imageMarkup=(url,text,isFirst=false)=>`<img class="journal-image" src="${e(optimizedImageUrl(url))}" data-original-src="${e(url)}" loading="${isFirst?'eager':'lazy'}" decoding="async" fetchpriority="${isFirst?'high':'auto'}">${text?`<div class="journal-image-text">${e(text)}</div>`:''}`;
    const applyImageFallbacks=root=>root.querySelectorAll('img[data-original-src]').forEach(image=>{const original=image.dataset.originalSrc;image.onerror=()=>{if(image.dataset.pngFallback!=='1'&&/\.png$/i.test(original)){image.dataset.pngFallback='1';image.src=original.replace('/storage/v1/object/public/site-assets/','/storage/v1/object/public/site-assets/web-optimized/');return;}image.onerror=null;image.src=original;};});
    const toUrls=value=>{if(typeof value==='string'){try{value=JSON.parse(value)}catch{value=[]}}return Array.isArray(value)?value.map(item=>typeof item==='string'?item:item?.url).filter(Boolean):[];};
    (async()=>{
      try{
        const{data,error}=await c.from('journal_entries').select('title,visit_date,content,content_blocks,gallery,cover_url').eq('id',id).eq('status','published').single();
        if(error||!data)throw error||new Error('Journal entry not found.');
        titleNode.textContent=data.title||'';
        if(data.visit_date){const dateParts=String(data.visit_date).slice(0,10).split('-');if(dateParts.length===3)document.getElementById('date').textContent=`${dateParts[0]}.${dateParts[1]}.${dateParts[2]}`;}
        let blocks=data.content_blocks;
        if(typeof blocks==='string'){try{blocks=JSON.parse(blocks)}catch{blocks=[]}}
        blocks=Array.isArray(blocks)?blocks:[];
        if(blocks.length){
          let imageIndex=0;
          contentNode.innerHTML=blocks.map(block=>{
            if(block.type==='text')return `<div class="journal-block-text">${e(block.content)}</div>`;
            if(block.type==='image'&&block.url)return imageMarkup(block.url,block.text,imageIndex++===0);
            return '';
          }).join('');
        }else{
          const legacyContent=data.content?`<div class="journal-block-text">${e(data.content)}</div>`:'';
          const legacyUrls=toUrls(data.gallery);
          if(!legacyUrls.length&&data.cover_url)legacyUrls.push(data.cover_url);
          const legacyGallery=legacyUrls.map((url,index)=>imageMarkup(url,'',index===0)).join('');
          contentNode.innerHTML=legacyContent+legacyGallery;
        }
        applyImageFallbacks(contentNode);
        loadingNode.classList.add('hidden');
        articleNode.classList.remove('hidden');
      }catch(error){
        console.error('Journal post render error:',error);
        loadingNode.textContent='文章讀取失敗，請確認瀏覽器 console。';
      }
    })();
    const d=document.getElementById('drawer'),o=document.getElementById('menuOpen');
    o.onclick=()=>d.classList.add('open');
    document.getElementById('menuClose').onclick=()=>d.classList.remove('open');
  </script>
</body>
</html>
