<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="public-site.css">
  <style>
    body{margin:0;font:15px/2.15 sans-serif}
    .article{max-width:620px;margin:auto;padding:180px 0}
    .hidden{display:none}
    .journal-block-text,.journal-image-text{white-space:pre-wrap;margin:0 0 28px}
    .journal-image{display:block;width:100%;height:auto;margin:32px 0 12px}
    @media(max-width:700px){.article{margin:0 20px;padding-top:132px}}
  </style>
</head>
<body class="rs-public">
  <header class="rs-site-header">
    <a class="rs-brand" href="index.html"><span class="rs-brand-jp">壤序空間制作所</span><span class="rs-brand-en">RAN SHU INTERIOR DESIGN</span></a>
    <nav class="rs-desktop-nav"><a href="index.html#works">WORKS</a><a href="service.html">SERVICE</a><a href="index.html#about">ABOUT</a><a href="journal.html">JOURNAL</a><a href="index.html#contact">CONTACT</a><a href="https://www.instagram.com/" target="_blank">Instagram</a></nav>
    <button id="menuOpen" class="rs-menu-button">MENU</button>
  </header>
  <nav id="drawer" class="rs-drawer">
    <button id="menuClose" class="rs-drawer-close">CLOSE</button>
    <div class="rs-drawer-inner"><ul class="rs-drawer-list"><li><a href="index.html#works">WORKS</a></li><li><a href="service.html">SERVICE</a></li><li><a href="index.html#about">ABOUT</a></li><li><a href="journal.html">JOURNAL</a></li><li><a href="index.html#contact">CONTACT</a></li><li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li></ul></div>
  </nav>
  <article class="article">
    <div id="loading">Loading...</div>
    <div id="article" class="hidden"><h1 id="title"></h1><div id="content"></div></div>
  </article>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="public-image.js"></script>
  <script>
    const c=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY);
    const id=new URLSearchParams(location.search).get('id');
    const e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
    const articleImageWidth=window.matchMedia('(max-width:700px)').matches?1200:2000;
    const articleImageUrl=url=>window.rangshuImageUrl?window.rangshuImageUrl(url,articleImageWidth,85):url;
    const imageMarkup=(url,text,isFirst)=>`<img class="journal-image" src="${e(articleImageUrl(url))}" loading="${isFirst?'eager':'lazy'}" decoding="async" fetchpriority="${isFirst?'high':'auto'}">${text?`<div class="journal-image-text">${e(text)}</div>`:''}`;
    const toUrls=value=>{if(typeof value==='string'){try{value=JSON.parse(value)}catch{value=[]}}return Array.isArray(value)?value.map(item=>typeof item==='string'?item:item?.url).filter(Boolean):[];};
    (async()=>{
      const{data,error}=await c.from('journal_entries').select('title,content,content_blocks,gallery').eq('id',id).eq('status','published').single();
      if(error||!data){console.error('Journal post load error:',error);return;}
      title.textContent=data.title||'';
      const blocks=Array.isArray(data.content_blocks)?data.content_blocks:[];
      if(blocks.length){
        let imageIndex=0;
        content.innerHTML=blocks.map(block=>{
          if(block.type==='text')return `<div class="journal-block-text">${e(block.content)}</div>`;
          if(block.type==='image'&&block.url)return imageMarkup(block.url,block.text,imageIndex++===0);
          return '';
        }).join('');
      }else{
        const legacyContent=data.content?`<div class="journal-block-text">${e(data.content)}</div>`:'';
        const legacyGallery=toUrls(data.gallery).map((url,index)=>imageMarkup(url,'',index===0)).join('');
        content.innerHTML=legacyContent+legacyGallery;
      }
      loading.classList.add('hidden');
      article.classList.remove('hidden');
    })();
    const d=document.getElementById('drawer'),o=document.getElementById('menuOpen');
    o.onclick=()=>d.classList.add('open');
    document.getElementById('menuClose').onclick=()=>d.classList.remove('open');
  </script>
</body>
</html>
