le=`${data.title} — 壤序空間制作所`;document.getElementById('date').textContent=[fd(data.visit_date||data.published_at||data.created_at||''),data.location].filter(Boolean).join(' / ');document.getElementById('title').textContent=data.title||'';document.getElementById('excerpt').textContent=data.excerpt||'';document.getElementById('content').textContent=data.content||'';if(data.cover_url){const coverNode=document.getElementById('cover');coverNode.src=data.cover_url;coverNode.alt=data.title||'';coverNode.classList.remove('hidden')}loadingNode.classList.add('hidden');document.getElementById('article').classList.remove('hidden')})();const drawer=document.getElementById('drawer'),menuOpen=document.getElementById('menuOpen'),menuClose=document.getElementById('menuClose');menuOpen.addEventListener('click',()=>{drawer.classList.add('open');menuOpen.setAttribute('aria-expanded','true')});menuClose.addEventListener('click',()=>{drawer.classList.remove('open');menuOpen.setAttribute('aria-expanded','false')});drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{drawer.classList.remove('open');menuOpen.setAttribute('aria-expanded','false')}));</script></body></html>
