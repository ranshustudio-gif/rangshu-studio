<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOURNAL</title><link rel="stylesheet" href="public-site.css"><style>*{box-sizing:border-box}body{margin:0;font:15px/2.15 "Noto Sans TC","Noto Sans JP",sans-serif;color:#222}.hidden{display:none!important}.journal-article{max-width:760px;margin:0 auto;padding:180px 0 100px}.journal-title{margin:0;font:400 28px/1.55 var(--rs-serif);letter-spacing:.06em}.journal-date{margin-top:16px;padding-bottom:20px;border-bottom:1px solid #ddd;font-size:11px;letter-spacing:.08em;color:#777}.journal-post-body{margin-top:44px}.journal-block-text{max-width:620px;white-space:pre-wrap;margin:0 0 28px}.journal-image{display:block;width:auto;height:auto;max-width:100%;margin:36px 0;object-fit:contain}.journal-image.landscape{max-width:720px}.journal-image.portrait{max-width:420px}.journal-image+.journal-image{margin-top:-16px}.back{display:inline-block;margin-top:60px}@media(max-width:700px){.journal-article{width:auto;margin:0 20px;padding:132px 0 80px}.journal-title{font-size:23px}.journal-image,.journal-image.landscape,.journal-image.portrait{width:auto;height:auto;max-width:100%;margin:32px 0}}</style></head><body class="rs-public"><main><article class="journal-article"><div id="loading">Loading...</div><div id="article" class="hidden"><h1 id="title" class="journal-title"></h1><div id="date" class="journal-date"></div><div id="content" class="journal-post-body"></div><a class="back" href="journal.html">← JOURNAL</a></div></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x])),fit=i=>i.addEventListener('load',()=>i.classList.add(i.naturalWidth>i.naturalHeight?'landscape':'portrait'),{once:true});(async()=>{const l=document.getElementById('loading'),{data,error}=await c.from('journal_entries').select('title,visit_date,published_at,content,content_blocks,gallery').eq('id',id).eq('status','published').single();if(error||!data){console.error('Journal load error:',error);l.textContent='找不到這篇紀錄。';return}document.getElementById('title').textContent=data.title||'';document.getElementById('date').textContent=(data.visit_date||data.published_at||'').slice(0,10).replaceAll('-','.');const out=document.getElementById('content'),b=Array.isArray(data.content_blocks)?data.content_blocks:[];if(b.length)out.innerHTML=b.map(x=>x.type==='text'?`<div class="journal-block-text">${esc(x.content)}</div>`:x.type==='image'&&x.url?`<img class="journal-image" src="${esc(x.url)}" alt="">`:'').join('');else{out.textContent=data.content||'';(Array.isArray(data.gallery)?data.gallery:[]).forEach(x=>{const u=typeof x==='string'?x:x?.url;if(u)out.insertAdjacentHTML('beforeend',`<img class="journal-image" src="${esc(u)}" alt="">`)})}out.querySelectorAll('img').forEach(fit);l.classList.add('hidden');document.getElementById('article').classList.remove('hidden')})()</script></body></html>
