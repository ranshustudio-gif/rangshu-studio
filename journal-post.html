<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOURNAL — 壤序空間制作所</title><link rel="stylesheet" href="public-site.css"><style>*{box-sizing:border-box}html,body{margin:0}body{font-family:"Noto Sans TC","Noto Sans JP",sans-serif;color:#222;font-weight:300}.hidden{display:none!important}.page{padding:78px 42px 100px}.article{max-width:900px;margin:auto}.date{font:10px Arial;color:#999;margin-bottom:12px}.article h1{font-size:28px;font-weight:300;line-height:1.55;margin:0 0 22px}.excerpt{font-size:14px;line-height:2;color:#666;margin-bottom:34px;max-width:720px}.cover{display:block;width:100%;margin-bottom:45px}.journal-post-body{font-size:15px;line-height:2.15;white-space:pre-wrap;max-width:760px}.journal-post-body img{display:block;width:auto;max-width:520px;max-height:80vh;height:auto;margin:32px auto}.back{display:inline-block;margin-top:65px;padding-top:10px;border-top:1px solid #ddd}@media(max-width:700px){.page{padding:58px 20px 80px}.journal-post-body img{max-width:calc(100vw - 40px);height:auto}}</style></head><body class="rs-public"><header class="rs-site-header"><a class="rs-brand" href="index.html"><span class="rs-brand-jp">壤序空間制作所</span><span class="rs-brand-en">RAN SHU INTERIOR DESIGN</span></a><nav class="rs-desktop-nav"><a href="index.html#works">WORKS</a><a href="index.html#about">ABOUT</a><a href="index.html#journal">JOURNAL</a><a href="index.html#contact">CONTACT</a></nav><button id="menuOpen" class="rs-menu-button">MENU</button></header><nav id="drawer" class="rs-drawer"><button id="menuClose" class="rs-drawer-close">CLOSE</button><div class="rs-drawer-inner"><ul class="rs-drawer-list"><li><a href="index.html#works">WORKS</a></li><li><a href="index.html#about">ABOUT</a></li><li><a href="index.html#journal">JOURNAL</a></li><li><a href="index.html#contact">CONTACT</a></li></ul></div></nav><main class="page rs-public-page"><div id="loading">Loading...</div><article id="article" class="article hidden"><div id="date" class="date"></div><h1 id="title"></h1><div id="excerpt" class="excerpt"></div><img id="cover" class="cover hidden" alt=""><div id="content" class="journal-post-body"></div><a class="back" href="journal.html">← JOURNAL</a></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY),id=new URLSearchParams(location.search).get('id');(async()=>{const l=document.getElementById('loading');if(!id)return;const{data,error}=await c.from('journal_entries').select('*').eq('id',id).eq('status','published').single();if(error||!data){console.error('Journal load error:',error);l.textContent='找不到這篇紀錄。';return}document.getElementById('date').textContent=[data.visit_date,data.location].filter(Boolean).join(' / ');document.getElementById('title').textContent=data.title||'';document.getElementById('excerpt').textContent=data.excerpt||'';document.getElementById('content').textContent=data.content||'';if(data.cover_url){const i=document.getElementById('cover');i.src=data.cover_url;i.classList.remove('hidden')}l.classList.add('hidden');document.getElementById('article').classList.remove('hidden')})();const d=document.getElementById('drawer'),o=document.getElementById('menuOpen');o.onclick=()=>d.classList.add('open');document.getElementById('menuClose').onclick=()=>d.classList.remove('open');</script></body></html>
