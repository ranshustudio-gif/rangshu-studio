<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOURNAL</title><link rel="stylesheet" href="public-site.css"><style>*{box-sizing:border-box}body{margin:0;font:15px/2.15 "Noto Sans TC","Noto Sans JP",sans-serif;color:#222}.hidden{display:none!important}.page{padding:78px 42px 100px}.article{max-width:900px;margin:auto}.cover{display:block;width:100%;height:auto;margin:0 0 45px}.journal-post-body{max-width:600px;margin:0 auto;white-space:pre-wrap}.journal-post-body img{display:block;width:100%;height:auto;margin:32px auto}.journal-block-text{white-space:pre-wrap;margin:0 0 32px}@media(max-width:700px){.page{padding:58px 20px 80px}.journal-post-body img{max-width:calc(100vw - 40px)}}</style></head><body class="rs-public"><main class="page rs-public-page"><div id="loading">Loading...</div><article id="article" class="article hidden"><h1 id="title"></h1><img id="cover" class="cover hidden" alt=""><div id="content" class="journal-post-body"></div><a href="journal.html">← JOURNAL</a></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));(async()=>{const l=document.getElementById('loading'),{data,error}=await c.from('journal_entries').select('title,content,content_blocks,gallery,cover_url').eq('id',id).eq('status','published').single();if(error||!data){console.error('Journal load error:',error);l.textContent='找不到這篇紀錄。';return}document.getElementById('title').textContent=data.title||'';if(data.cover_url){const i=document.getElementById('cover');i.src=data.cover_url;i.classList.remove('hidden')}const out=document.getElementById('content'),blocks=Array.isArray(data.content_blocks)?data.content_blocks:[];if(blocks.length){out.innerHTML=blocks.map(b=>b.type==='image'&&b.url?`<img src="${esc(b.url)}" alt="">`:b.type==='text'?`<div class="journal-block-text">${esc(b.content)}</div>`:'').join('')}else{out.textContent=data.content||'';(Array.isArray(data.gallery)?data.gallery:[]).forEach(b=>{const u=typeof b==='string'?b:b?.url;if(u)out.insertAdjacentHTML('beforeend',`<img src="${esc(u)}" alt="">`)})}l.classList.add('hidden');document.getElementById('article').classList.remove('hidden')})()</script></body></html>
