<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品 — 壤序空間制作所</title>
  <link rel="stylesheet" href="public-site.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0}body{font-family:var(--rs-serif);font-weight:400;color:var(--rs-ink);background:var(--rs-paper)}a{color:inherit;text-decoration:none}.hidden{display:none!important}
    .works-page{padding:180px var(--rs-side) 100px}.works-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.work-item{min-width:0}.work-card{display:block}.work-media{position:relative;aspect-ratio:3/2;overflow:hidden;background:#efeee9}.work-media img{display:block;width:100%;height:100%;object-fit:cover}.work-placeholder{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:10px;letter-spacing:.12em;color:#777}.work-title{margin-top:12px;font-size:15px;font-weight:400;letter-spacing:.08em;line-height:1.6}.work-year{margin-top:4px;font-size:10px;font-weight:400;letter-spacing:.1em;color:#777}.works-message{font-size:13px;letter-spacing:.05em;color:#777}
    @media(max-width:767px){.works-page{padding:132px var(--rs-side) 80px}.works-grid{grid-template-columns:1fr;gap:4px}.work-item{position:relative;aspect-ratio:4/3;overflow:hidden}.work-card{width:100%;height:100%}.work-media{width:100%;height:100%;aspect-ratio:auto}.work-title,.work-year{display:none}.work-overlay{position:absolute;z-index:1;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s ease}.work-overlay-title{position:relative;z-index:2;font-family:var(--rs-serif);font-size:17px;font-weight:400;letter-spacing:.08em;color:#fff;opacity:0;transition:opacity .3s ease}.work-item.is-active .work-overlay{opacity:1}.work-item.is-active .work-overlay-title{opacity:1}}
  </style>
</head>
<body class="rs-public">
  <header class="rs-site-header">
    <a class="rs-brand" href="index.html"><span class="rs-brand-jp">壤序空間制作所</span><span class="rs-brand-en">RAN SHU INTERIOR DESIGN</span></a>
    <nav class="rs-desktop-nav" aria-label="網站導覽"><a href="works.html">WORKS</a><a href="service.html">SERVICE</a><a href="index.html#about">ABOUT</a><a href="journal.html">JOURNAL</a><a href="index.html#contact">CONTACT</a><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></nav>
    <button id="menuOpen" class="rs-menu-button" type="button" aria-label="menu" aria-expanded="false">MENU</button>
  </header>
  <nav id="drawer" class="rs-drawer" aria-label="行動版導覽"><button id="menuClose" class="rs-drawer-close" type="button">CLOSE</button><div class="rs-drawer-inner"><div><ul class="rs-drawer-list"><li><a href="works.html"><span class="rs-drawer-jp">作品</span><span class="rs-drawer-en">WORKS</span></a></li><li><a href="service.html"><span class="rs-drawer-jp">服務內容</span><span class="rs-drawer-en">SERVICE</span></a></li><li><a href="index.html#about"><span class="rs-drawer-jp">關於</span><span class="rs-drawer-en">ABOUT</span></a></li><li><a href="journal.html"><span class="rs-drawer-jp">建築・空間紀錄</span><span class="rs-drawer-en">JOURNAL</span></a></li><li><a href="index.html#contact"><span class="rs-drawer-jp">聯絡</span><span class="rs-drawer-en">CONTACT</span></a></li></ul><a class="rs-drawer-social" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></div></div></nav>
  <main class="rs-public-page works-page"><div id="worksMessage" class="works-message">Loading...</div><div id="worksGrid" class="works-grid"></div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const grid=document.getElementById('worksGrid'),message=document.getElementById('worksMessage');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const optimizedImageUrl=value=>{if(typeof value!=='string'||!value)return value;const marker='/storage/v1/object/public/site-assets/';if(!value.includes(marker)||/\.dng$/i.test(value))return value;return value.replace(marker,marker+'web-optimized/').replace(/\.[^.?#]+(?=\?|$)/,'.jpg');};
    const applyImageFallbacks=root=>root.querySelectorAll('img[data-original-src]').forEach(image=>{const original=image.dataset.originalSrc;image.onerror=()=>{if(image.dataset.pngFallback!=='1'&&/\.png$/i.test(original)){image.dataset.pngFallback='1';image.src=original.replace('/storage/v1/object/public/site-assets/','/storage/v1/object/public/site-assets/web-optimized/');return;}image.onerror=null;image.src=original;};});
    async function renderPublicWorks(){
      try{
        if(!window.supabase||!window.RANGSHU_SUPABASE_URL||!window.RANGSHU_SUPABASE_KEY)throw new Error('Supabase configuration is unavailable.');
        const client=window.supabase.createClient(window.RANGSHU_SUPABASE_URL,window.RANGSHU_SUPABASE_KEY);
        let {data,error}=await client.schema('public').from('works').select('id,title,year,month,cover_url,created_at').eq('status','published').order('year',{ascending:false,nullsFirst:false}).order('month',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
        if(error&&error.code==='42703'&&/month/i.test(error.message||'')){
          const fallback=await client.schema('public').from('works').select('id,title,year,cover_url,created_at').eq('status','published').order('year',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});
          data=fallback.data;error=fallback.error;
        }
        if(error)throw error;
        console.info('Works query returned:',data.length);
        message.classList.add('hidden');
        if(!data?.length){message.textContent='作品準備中';message.classList.remove('hidden');return;}
        grid.innerHTML=data.map((work,index)=>{const title=esc(work.title||'Untitled');const loading=index<3?'eager':'lazy';const priority=index<3?'high':'auto';const media=work.cover_url?`<img src="${esc(optimizedImageUrl(work.cover_url))}" data-original-src="${esc(work.cover_url)}" alt="${title}" loading="${loading}" decoding="async" fetchpriority="${priority}">`:'<div class="work-placeholder">WORK</div>';const year=work.year?`<div class="work-year">${esc(work.year)}</div>`:'';return `<article class="work-item"><a class="work-card" href="work-post.html?id=${encodeURIComponent(work.id)}"><div class="work-media">${media}<span class="work-overlay"><span class="work-overlay-title">${title}</span></span></div><div class="work-title">${title}</div>${year}</a></article>`;}).join('');
        applyImageFallbacks(grid);
        setupMobileWorkScroll();
        console.info('Works cards rendered:',grid.querySelectorAll('.work-item').length);
      }catch(error){console.error('Works load error:',error);message.textContent='作品讀取失敗';}
    }
    let worksScrollFrame;
    let worksScrollEventsBound=false;
    function updateActiveWork(){
      if(!window.matchMedia('(max-width: 767px)').matches)return;
      const items=Array.from(document.querySelectorAll('#worksGrid .work-item'));
      const viewportCenter=window.innerHeight/2;
      let closest=null;
      let closestDistance=Infinity;
      items.forEach(item=>{
        const rect=item.getBoundingClientRect();
        if(rect.bottom<=0||rect.top>=window.innerHeight)return;
        const distance=Math.abs((rect.top+rect.height/2)-viewportCenter);
        if(distance<closestDistance){closestDistance=distance;closest=item;}
      });
      items.forEach(item=>item.classList.toggle('is-active',item===closest));
    }
    function setupMobileWorkScroll(){
      if(!worksScrollEventsBound){
        window.addEventListener('scroll',()=>{cancelAnimationFrame(worksScrollFrame);worksScrollFrame=requestAnimationFrame(updateActiveWork);},{passive:true});
        window.addEventListener('resize',updateActiveWork);
        worksScrollEventsBound=true;
      }
      updateActiveWork();
    }
    renderPublicWorks();
    const drawer=document.getElementById('drawer'),open=document.getElementById('menuOpen'),close=document.getElementById('menuClose');open.addEventListener('click',()=>{drawer.classList.add('open');open.setAttribute('aria-expanded','true')});close.addEventListener('click',()=>{drawer.classList.remove('open');open.setAttribute('aria-expanded','false')});drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{drawer.classList.remove('open');open.setAttribute('aria-expanded','false')}));
  </script>
</body>
</html>
